<!doctype html>
            
<html lang="en">

<head>
 <meta charset="utf-8">
 <title>transition page</title>
 <style>
    #one{
        width: 100px;
        height: 100px;
        background: pink;
        border: 3px solid #fa5c76;
        transition: background 1s, transform 2s;
    }
    #one:hover{
        background: #fa5c76;
        transform: rotate(720deg) scaleX(2);
    }
    h1{
        width: 100px;
        background: pink;
        border: 3px solid #fa5c76;
        transition: background 0.5s, transform 1s;
    }
    h1:hover{
        color: #fa5c76;
        width: 100px;
        border: pink;
        transform: rotate(360deg) scale(2);
    }
    #two{
        width: 100px;
        height: 100px;
        background: #52f9ff;
        border: 3px solid #23b2b7;
        transition: background 1s, transform 2s;
    }
    #two:hover{
        background: #23b2b7;
        transform: rotateY(720deg);
    }
    h2{
        width: 100px;
        background: #52f9ff;
        border: 3px solid #23b2b7;
        transition: background 0.5s, transform 1s;
    }
    h2:hover{
        color: #23b2b7;
        width: 100px;
        border: #52f9ff;
        transform: rotateY(360deg);
    }
 </style>
</head>

<body>
<div id="one"></div>
<h1>Heyyy!</h1>
<div id="two"></div>
<h2>Heyyy!</h2>
</body>

</html>
