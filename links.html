<!doctype html>
            
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>links page</title>
  <style>
    a{
        color: blue;
        text-decoration: none;
        display:block;
        width: 150px;
        height: 30px;
        border-radius: 20px;
        background: pink;
        border: 1px solid #fc6f87;
        padding: 10px;
        text-align: center;
        box-shadow: 5px 5px 0px #fc6f87;
    }

    a:hover{
        color: #a7d0f6;
        text-decoration: overline;
        font-weight:900;
        border: 2px solid transparent;
        background: #fc6f87;
        box-shadow: 5px 5px 0px #0000;
    }
    
    a:active{
        background: #000;
    }

    .two{
        color: purple;
        background: #8efb8e;
        border: 1px solid #05dc05;
        border-radius: 0px;
        box-shadow: 5px 5px 0px #05dc05;
    }

    .two:hover{
        color: rgb(193, 0, 193);
        border: 2px solid transparent;
        background: #02c202;
        box-shadow: 5px 5px 0px #0000;
    }

    .three{
        color: #fc6f87;
        background: #a7d0f6;
        border: 1px solid blue;
        border-radius: 30px;
        box-shadow: 5px 5px 0px blue;

    }

    .three:hover{
        color: pink;
        border: 2px solid transparent;
        background: blue;
        box-shadow: 5px 5px 0px #0000;
    }
  </style>
</head>

<body>
 <p><a href="#">link text</a></p>
 <p><a class="two" href="#">link text</a></p>
 <p><a class="three" href="#">link text</a></p>
</body>

</html>
